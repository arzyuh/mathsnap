<!doctype html>
<html lang="mk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>MathSnap</title>
<!-- ВАЖНО: зголеми го ?v=N на style.css/app.js при секоја промена -
     browser-от агресивно кешира статични JS/CSS фајлови, без верзија
     корисниците би виделе стара кеширана логика по deploy. -->
<link rel="stylesheet" href="style.css?v=2" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="logo">📐 MathSnap</div>
    <p class="tagline">Скенирај или внеси математички проблем</p>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="scan">📷 Скенирај</button>
    <button class="tab-btn" data-tab="calc">🔢 Калкулатор</button>
  </nav>

  <main>
    <!-- ============ SCAN TAB ============ -->
    <section id="tab-scan" class="tab-panel active">
      <div class="scan-mode-toggle">
        <button id="mode-live-btn" class="mode-btn active">🎥 Live камера</button>
        <button id="mode-upload-btn" class="mode-btn">🖼️ Прикачи слика</button>
      </div>

      <!-- ---- Live camera mode ---- -->
      <div id="live-mode" class="card">
        <div class="video-wrap">
          <video id="camera-video" autoplay playsinline muted></video>
          <div id="live-badge" class="live-badge" hidden></div>
        </div>
        <div class="live-controls">
          <button id="live-start-btn" class="primary-btn">🎥 Вклучи камера</button>
          <button id="live-capture-btn" class="secondary-btn" hidden>📸 Сними рачно</button>
          <button id="live-stop-btn" class="secondary-btn" hidden>⏹ Стоп</button>
        </div>
        <p id="live-status" class="status"></p>
        <canvas id="capture-canvas" hidden></canvas>
      </div>

      <!-- ---- Upload photo mode ---- -->
      <div id="upload-mode" class="card" hidden>
        <label class="file-drop" for="image-input">
          <span id="drop-label">📷 Слушни слика / фотографирај</span>
          <input id="image-input" type="file" accept="image/*" capture="environment" hidden />
        </label>
        <img id="preview" class="preview" hidden alt="преглед на сликата" />
        <button id="scan-btn" class="primary-btn" disabled>Препознај и реши</button>
        <p id="scan-status" class="status"></p>
      </div>

      <div id="scan-recognized" class="card" hidden>
        <h3>Препознаено:</h3>
        <input id="recognized-text" type="text" class="text-input" />
        <button id="resolve-recognized-btn" class="secondary-btn">Реши повторно</button>
      </div>
    </section>

    <!-- ============ CALC TAB ============ -->
    <section id="tab-calc" class="tab-panel">
      <div class="card">
        <input id="calc-input" type="text" class="text-input calc-display" placeholder="пр. 2x + 3 = 11" />
        <div class="keypad">
          <button data-insert="7">7</button><button data-insert="8">8</button><button data-insert="9">9</button><button data-insert="/">÷</button>
          <button data-insert="4">4</button><button data-insert="5">5</button><button data-insert="6">6</button><button data-insert="*">×</button>
          <button data-insert="1">1</button><button data-insert="2">2</button><button data-insert="3">3</button><button data-insert="-">−</button>
          <button data-insert="0">0</button><button data-insert=".">.</button><button data-insert="x">x</button><button data-insert="+">+</button>
          <button data-insert="(">(</button><button data-insert=")">)</button><button data-insert="^2">x²</button><button data-insert="^">^</button>
          <button data-insert="sqrt()">√</button><button data-insert="=">=</button>
          <button id="calc-clear" class="wide">Избриши</button>
          <button id="calc-back">⌫</button>
        </div>
        <div class="keypad keypad-advanced">
          <button data-insert="sin()">sin</button>
          <button data-insert="cos()">cos</button>
          <button data-insert="tan()">tan</button>
          <button data-insert=";">;</button>
          <button data-insert="diff(,x)" data-cursor-offset="3">d/dx</button>
          <button data-insert="integrate(,x)" data-cursor-offset="3">∫ dx</button>
        </div>
        <button id="calc-solve-btn" class="primary-btn">Реши</button>
        <p id="calc-status" class="status"></p>
      </div>
    </section>

    <!-- ============ RESULTS ============ -->
    <section id="results" hidden>
      <div class="card result-card">
        <h2>Резултат</h2>
        <div class="correction-row">
          <label for="result-correction-input">Погрешно препознаено? Поправи:</label>
          <div class="correction-inputs">
            <input id="result-correction-input" type="text" class="text-input" />
            <button id="result-correction-btn" class="secondary-btn">Реши повторно</button>
          </div>
          <p id="correction-status" class="status"></p>
        </div>
        <div id="methods-container"></div>
        <div id="graph-container" hidden>
          <h3>График</h3>
          <img id="graph-img" alt="график" />
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>Поддржува: линеарни/квадратни/кубни равенки, системи равенки, деривати, интеграли, основна тригонометрија и симплификација.</p>
  </footer>

  <script src="app.js?v=5"></script>
</body>
</html>
